name: CI

on:
  push:
    branches:
      - refactor/project-architecture
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL_POOLED: postgresql://ci:ci@ep-ci.invalid/clickmenu?sslmode=require
          SITE_URL: http://localhost:3000
